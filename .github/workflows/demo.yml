name: Environnement de démonstration
# Branche Neon « demo » persistante, séparée de la production. Met à jour son schéma
# et produit un fichier d'environnement chiffré pour le site de démonstration.
on:
  workflow_dispatch:
  push:
    branches: [launch/v1-professional-only]
    paths: ['.github/workflows/demo.yml', 'scripts/neon/demo-branch.mjs', 'drizzle/neon/**']
permissions:
  contents: read
concurrency:
  group: monservice-demo
  cancel-in-progress: false
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEON_API_KEY: ${{ secrets.NEON_CI_API_KEY }}
      DEMO_APP_URL: https://monservice-demo.vercel.app
      DEMO_ENV_PUBLIC_KEY: |
