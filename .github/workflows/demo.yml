    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: test -n "$NEON_API_KEY"
      - run: npm ci
      - run: npm install --global neon@8.0.7
      - run: node scripts/neon/demo-branch.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: demo-env-encrypted
          path: demo-output/env.enc.json
          retention-days: 1
