name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/monservice_test
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: monservice_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Verify PostgreSQL is ready
        run: |
          pg_isready -d "$DATABASE_URL" -t 5
          psql "$DATABASE_URL" -c "SELECT 1;"
      - name: Run Drizzle Migrations
        run: npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:security
      - run: npm run test:unit
      - run: npm run test:compliance
      - run: npm run build
      - run: npx playwright install --with-deps
      - run: npm run test:e2e:compliance
      - run: npm run test:e2e
