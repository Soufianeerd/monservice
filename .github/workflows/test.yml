name: CI Neon
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monservice-neon-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEON_API_KEY: ${{ secrets.NEON_CI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require project-scoped Neon credential
        run: test -n "$NEON_API_KEY"
      - run: npm ci
      - run: npm install --global neon@8.0.7
      - run: npx playwright install --with-deps chromium
      - name: Isolated schema, Auth, storage, security and browser validation
        run: node scripts/neon/ci-branch.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: neon-validation-evidence
          path: docs/database/artifacts/ci-validation-report.json
