name: Neon nightly regression
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
permissions:
  contents: read
concurrency:
  group: monservice-neon-validation
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEON_API_KEY: ${{ secrets.NEON_CI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: test -n "$NEON_API_KEY"
      - run: npm ci
      - run: npm install --global neon@8.0.7
      - run: npx playwright install --with-deps chromium
      - run: node scripts/neon/ci-branch.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: neon-validation-evidence
          path: docs/database/artifacts/ci-validation-report.json
