[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# Netlify Next Runtime v5 is installed as a direct dependency in package.json (@netlify/plugin-nextjs: ^5.15.13).
# Netlify automatically detects and configures the runtime from dependencies for Next.js App Router/SSR.
# Note: Explicit SPA rewrites (/* -> /index.html) must NEVER be added, as App Router handles SSR and API routes natively.
