[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# La redirection `/* -> /index.html` a été supprimée : c'est une règle de type
# SPA, incompatible avec le rendu serveur de Next.js. Le routage est géré par
# @netlify/plugin-nextjs (anomalie MS-023).
